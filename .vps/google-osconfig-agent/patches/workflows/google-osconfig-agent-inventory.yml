name: Google OS Config inventory package

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      policy_pr:
        description: Resume an exact publisher-policy proposal
        required: false
        type: string
  push:
    branches: [master]
    paths: ['.vps/google-osconfig-agent/patches/**', '.vps/google-osconfig-agent/repository.conf']
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: google-osconfig-agent-package
  cancel-in-progress: false

jobs:
  candidate-source:
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'workflow_dispatch' || inputs.policy_pr == '') &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        github.event.comment.user.type == 'Bot'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      deployments: read
    outputs:
      exists: ${{ steps.preflight.outputs.blocked != 'true' && steps.candidate.outputs.candidate_exists == 'true' }}
      sha: ${{ steps.candidate.outputs.candidate_sha }}
      pr: ${{ steps.candidate.outputs.candidate_pr }}
      branch: ${{ steps.candidate.outputs.candidate_branch }}
      upstream: ${{ steps.candidate.outputs.upstream_commit }}
      patch: ${{ steps.candidate.outputs.patch_sha }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      delta_pr: ${{ steps.candidate.outputs.delta_pr }}
      delta_branch: ${{ steps.candidate.outputs.delta_branch }}
      configuration_sha: ${{ steps.candidate.outputs.configuration_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Keep one active application or publisher candidate
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .vps/google-osconfig-agent/patches/release.py candidate-preflight .
      - name: Read the exact private lifecycle revision
        if: steps.preflight.outputs.blocked != 'true'
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open(".vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.preflight.outputs.blocked != 'true'
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        if: steps.preflight.outputs.blocked != 'true'
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> .git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - name: Hold the exact source for an open application review pair
        if: steps.preflight.outputs.blocked != 'true'
        id: source-preflight
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          OSCONFIG_RPM_SIGNING_FINGERPRINT: ${{ vars.OSCONFIG_RPM_SIGNING_FINGERPRINT }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: python3 -B .vps/google-osconfig-agent/patches/release.py application-source-preflight .
      - name: Resolve latest upstream release
        if: steps.preflight.outputs.blocked != 'true' && steps.source-preflight.outputs.held != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .vps/google-osconfig-agent/patches/prepare-source.sh --latest "$RUNNER_TEMP/osconfig-source"
      - name: Prepare the exact held upstream source
        if: steps.preflight.outputs.blocked != 'true' && steps.source-preflight.outputs.held == 'true'
        env:
          SOURCE_LOCK_BASE64: ${{ steps.source-preflight.outputs.source_lock_base64 }}
        run: |
          locked_tool="$RUNNER_TEMP/osconfig-locked-source-tool"
          mkdir -m 700 "$locked_tool"
          install -m 700 .vps/google-osconfig-agent/patches/prepare-source.sh "$locked_tool/prepare-source.sh"
          cmp -- .vps/google-osconfig-agent/patches/prepare-source.sh "$locked_tool/prepare-source.sh"
          python3 - "$locked_tool/source.lock" <<'PY'
          import base64, os, sys
          source_lock = base64.b64decode(os.environ["SOURCE_LOCK_BASE64"], validate=True)
          if len(source_lock) > 4096:
              raise SystemExit("Candidate source.lock exceeds its exact-source bound")
          with open(sys.argv[1], "xb") as stream:
              stream.write(source_lock)
          PY
          bash "$locked_tool/prepare-source.sh" --locked "$RUNNER_TEMP/osconfig-source"
      - name: Prepare exact-source native Codex review PR
        if: steps.preflight.outputs.blocked != 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          OSCONFIG_RPM_SIGNING_FINGERPRINT: ${{ vars.OSCONFIG_RPM_SIGNING_FINGERPRINT }}
          OSCONFIG_SOURCE_DIR: ${{ runner.temp }}/osconfig-source
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py prepare \
            "$RUNNER_TEMP/osconfig-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preflight.outputs.blocked != 'true' && steps.candidate.outputs.candidate_exists == 'true'
        with:
          name: google-osconfig-agent-candidate
          path: ${{ runner.temp }}/osconfig-candidate/inputs
          if-no-files-found: error
          retention-days: 3

  policy-resume:
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'workflow_dispatch' || inputs.policy_pr == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open("trusted/.vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> trusted/.git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - name: Continue any bounded publisher repair or review window
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          POLICY_PR_NUMBER: ${{ inputs.policy_pr }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: python3 -B trusted/.vps/google-osconfig-agent/patches/release.py policy-resume .

  policy-check:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'master' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'repair/osconfig-policy-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.policy_pr != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      changed: ${{ steps.check.outputs.policy_candidate_changed }}
      pr: ${{ steps.identity.outputs.pr }}
      head: ${{ steps.identity.outputs.head }}
      config: ${{ steps.identity.outputs.config }}
      candidate_id: ${{ steps.check.outputs.candidate_id }}
      candidate_pr: ${{ steps.check.outputs.candidate_pr }}
      delta_pr: ${{ steps.check.outputs.delta_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - name: Resolve and validate the exact proposal identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_PR_NUMBER: ${{ github.event.pull_request.number || inputs.policy_pr }}
        run: |
          test "$POLICY_PR_NUMBER" -gt 0
          gh api "repos/$GITHUB_REPOSITORY/pulls/$POLICY_PR_NUMBER" > "$RUNNER_TEMP/policy-pr.json"
          python3 -B - "$RUNNER_TEMP/policy-pr.json" "$POLICY_PR_NUMBER" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          pull=json.load(open(sys.argv[1], encoding="utf-8"))
          assert pull["number"] == int(sys.argv[2])
          assert pull["state"] == "open"
          assert pull["base"]["ref"] == "master"
          assert pull["head"]["repo"]["full_name"] == __import__("os").environ["GITHUB_REPOSITORY"]
          assert pull["head"]["ref"].startswith("repair/osconfig-policy-")
          for key,value in (("pr",str(pull["number"])),("head",pull["head"]["sha"]),
                            ("config",pull["base"]["sha"])):
              assert re.fullmatch(r"[0-9]+" if key == "pr" else r"[0-9a-f]{40}",value)
              print(f"{key}={value}")
          PY
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open("trusted/.vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> trusted/.git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.head }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare exact paired policy and assembled-application review contexts
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          OSCONFIG_RPM_SIGNING_FINGERPRINT: ${{ vars.OSCONFIG_RPM_SIGNING_FINGERPRINT }}
          POLICY_PR_NUMBER: ${{ steps.identity.outputs.pr }}
          POLICY_HEAD_SHA: ${{ steps.identity.outputs.head }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: python3 -B trusted/.vps/google-osconfig-agent/patches/release.py prepare-policy candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.policy_candidate_changed == 'true'
        with:
          name: google-osconfig-agent-policy-candidate
          path: candidate/inputs
          if-no-files-found: error
          retention-days: 3

  policy-review:
    needs: policy-check
    if: needs.policy-check.result == 'success' && needs.policy-check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.review.outputs.review_ready }}
      reason: ${{ steps.review.outputs.review_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open("trusted/.vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> trusted/.git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-osconfig-agent-policy-candidate
          path: ${{ runner.temp }}/osconfig-policy-candidate
      - name: Require the exact independent full and delta policy reviews
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: python3 -B trusted/.vps/google-osconfig-agent/patches/release.py review-pair \
          "$RUNNER_TEMP/osconfig-policy-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: google-osconfig-agent-policy-review-pair
          path: ${{ runner.temp }}/osconfig-policy-candidate/review-pair.json
          if-no-files-found: ignore
          retention-days: 3

  policy-final-guard:
    needs: [policy-check, policy-review]
    if: >-
      needs.policy-check.result == 'success' && needs.policy-check.outputs.changed == 'true' &&
      needs.policy-review.result == 'success' && needs.policy-review.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      deployments: read
    outputs:
      decision: ${{ steps.authorize.outputs.final_decision }}
      candidate_id: ${{ steps.authorize.outputs.final_candidate_id }}
      run_id: ${{ steps.authorize.outputs.final_run_id }}
      run_attempt: ${{ steps.authorize.outputs.final_run_attempt }}
      workflow_sha: ${{ steps.authorize.outputs.final_workflow_sha }}
      validated_bundle: ${{ steps.authorize.outputs.validated_bundle }}
      policy_validation_reuse: ${{ steps.authorize.outputs.policy_validation_reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open("trusted/.vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> trusted/.git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-osconfig-agent-policy-candidate
          path: ${{ runner.temp }}/osconfig-policy-candidate
      - name: Authorize one final policy-only validation on the exact review pair
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CANDIDATE_PR: ${{ needs.policy-check.outputs.candidate_pr }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: python3 -B trusted/.vps/google-osconfig-agent/patches/release.py authorize-final \
          "$RUNNER_TEMP/osconfig-policy-candidate"

  repair-policy-proposal:
    needs: [policy-check, policy-review, policy-final-guard, prepare, adopt-policy]
    if: >-
      always() &&
      needs.policy-check.outputs.pr != '' &&
      needs.policy-check.outputs.head != '' &&
      ((needs.policy-check.result == 'failure') ||
       (needs.policy-check.outputs.changed == 'true' &&
        ((needs.policy-review.result == 'failure') ||
         (needs.policy-review.result == 'success' && needs.policy-review.outputs.ready == 'false' &&
          needs.policy-review.outputs.reason != 'Both distinct exact-source review lists must complete before repair') ||
         (needs.policy-final-guard.result == 'failure') ||
         (needs.prepare.result == 'failure') ||
         (needs.adopt-policy.result == 'failure'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Request a separate machine repair for the publisher proposal
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          POLICY_PR_NUMBER: ${{ needs.policy-check.outputs.pr }}
          POLICY_HEAD_SHA: ${{ needs.policy-check.outputs.head }}
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py failed-job-evidence \
            "$GITHUB_RUN_ID" "$RUNNER_TEMP/policy-failure.log"
          python3 -B .vps/google-osconfig-agent/patches/release.py repair-policy-pr \
            "$POLICY_PR_NUMBER" "$POLICY_HEAD_SHA" "$RUNNER_TEMP/policy-failure.log"

  build-rpm:
    needs: [candidate-source, review, final-guard, prepare]
    if: >-
      always() && !cancelled() &&
      needs.candidate-source.outputs.exists == 'true' &&
      needs.review.result == 'success' && needs.review.outputs.ready == 'true' &&
      needs.final-guard.result == 'success' && needs.final-guard.outputs.decision == 'allow' &&
      needs.final-guard.outputs.candidate_id == needs.candidate-source.outputs.candidate_id &&
      needs.final-guard.outputs.run_id == github.run_id &&
      needs.final-guard.outputs.run_attempt == github.run_attempt &&
      needs.final-guard.outputs.workflow_sha == github.sha &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: fedora:44
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      failure_class: ${{ steps.classify.outputs.failure_class }}
    steps:
      - name: Check the frozen native run attempt before checkout or Fedora tools
        id: preflight
        env:
          EXPECTED_RUN_ID: ${{ needs.final-guard.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.final-guard.outputs.run_attempt }}
          EXPECTED_WORKFLOW_SHA: ${{ needs.final-guard.outputs.workflow_sha }}
          EXPECTED_CANDIDATE_ID: ${{ needs.final-guard.outputs.candidate_id }}
          EXPECTED_DECISION: ${{ needs.final-guard.outputs.decision }}
          SOURCE_CANDIDATE_ID: ${{ needs.candidate-source.outputs.candidate_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DECISION" == allow ]]
          [[ "$EXPECTED_RUN_ID" == "$GITHUB_RUN_ID" ]]
          [[ "$EXPECTED_RUN_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$EXPECTED_CANDIDATE_ID" == "$SOURCE_CANDIDATE_ID" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open(".vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - name: Install private checkout transport tools
        run: dnf -y install git openssh-clients
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> .git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - name: Install Fedora build tools
        id: tools
        run: dnf -y install golang rpm-build go-rpm-macros go-vendor-tools systemd systemd-rpm-macros git jq tar bzip2 gzip gh python3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-osconfig-agent-candidate
          path: ${{ runner.temp }}/osconfig-candidate
      - name: Verify this exact native run attempt before the one build and test pass
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ needs.candidate-source.outputs.pr }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py verify-final-run \
            "$RUNNER_TEMP/osconfig-candidate" \
            "${{ needs.final-guard.outputs.run_id }}" \
            "${{ needs.final-guard.outputs.run_attempt }}" \
            "${{ needs.final-guard.outputs.workflow_sha }}" \
            "${{ needs.final-guard.outputs.candidate_id }}"
      - name: Remove private lifecycle checkout before candidate build code
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GITHUB_WORKSPACE" && "$GITHUB_WORKSPACE" != "/" ]]
          private_root="$GITHUB_WORKSPACE/machine-maintenance"
          rm -rf -- "$private_root"
          [[ ! -e "$private_root" && ! -L "$private_root" ]]
      - name: Build the Fedora RPM
        id: package_build
        env:
          VPS_RPM_RELEASE: 1.vps${{ github.run_number }}
        run: |
          bash "$RUNNER_TEMP/osconfig-candidate/build-rpm.sh" \
            "$RUNNER_TEMP/osconfig-candidate" "$RUNNER_TEMP/osconfig-built"
      - name: Record the exact native build artifact identity
        id: provenance
        env:
          EXPECTED_CANDIDATE_ID: ${{ needs.final-guard.outputs.candidate_id }}
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py \
            write-build-provenance "$RUNNER_TEMP/osconfig-candidate" "$RUNNER_TEMP/osconfig-built"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: google-osconfig-agent-built-rpm
          path: ${{ runner.temp }}/osconfig-built
          if-no-files-found: error
          retention-days: 3
      - name: Classify the failed stage for separate application or publisher repair
        id: classify
        if: always()
        env:
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          BUILD_OUTCOME: ${{ steps.package_build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$PREFLIGHT_OUTCOME" == failure || "$TOOLS_OUTCOME" == failure ||
                "$PROVENANCE_OUTCOME" == failure || "$ARTIFACT_OUTCOME" == failure ]]; then
            echo 'failure_class=publisher' >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_OUTCOME" == failure ]]; then
            echo 'failure_class=application' >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_JOB_STATUS" == failure ]]; then
            echo 'failure_class=publisher' >> "$GITHUB_OUTPUT"
          else
            echo 'failure_class=none' >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: candidate-source
    if: needs.candidate-source.outputs.exists == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      ready: ${{ steps.gate.outputs.review_ready }}
      reason: ${{ steps.gate.outputs.review_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
