      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: google-osconfig-agent-review-pair
          path: ${{ runner.temp }}/osconfig-candidate/review-pair.json
          if-no-files-found: ignore
          retention-days: 3

  final-guard:
    needs: [candidate-source, review]
    if: >-
      needs.candidate-source.outputs.exists == 'true' &&
      needs.review.result == 'success' && needs.review.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      deployments: read
    outputs:
      decision: ${{ steps.authorize.outputs.final_decision }}
      candidate_id: ${{ steps.authorize.outputs.final_candidate_id }}
      run_id: ${{ steps.authorize.outputs.final_run_id }}
      run_attempt: ${{ steps.authorize.outputs.final_run_attempt }}
      workflow_sha: ${{ steps.authorize.outputs.final_workflow_sha }}
      reuse_run_id: ${{ steps.authorize.outputs.reuse_run_id }}
      reuse_run_attempt: ${{ steps.authorize.outputs.reuse_run_attempt }}
      reuse_workflow_sha: ${{ steps.authorize.outputs.reuse_workflow_sha }}
      reuse_legacy_attempt_one: ${{ steps.authorize.outputs.reuse_legacy_attempt_one }}
      policy_validation_reuse: ${{ steps.authorize.outputs.policy_validation_reuse }}
      validated_bundle: ${{ steps.authorize.outputs.validated_bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
