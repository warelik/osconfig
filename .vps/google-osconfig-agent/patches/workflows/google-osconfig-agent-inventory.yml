  publish:
    needs: [candidate-source, review, final-guard, prepare, sign, recover-validated]
    if: >-
      always() && !cancelled() &&
      needs.candidate-source.outputs.exists == 'true' &&
      (needs.final-guard.outputs.decision == 'allow' ||
       needs.final-guard.outputs.decision == 'already-validated') &&
      needs.prepare.result == 'success' &&
      needs.final-guard.outputs.candidate_id == needs.candidate-source.outputs.candidate_id &&
      needs.final-guard.outputs.run_id == github.run_id &&
      needs.final-guard.outputs.run_attempt == github.run_attempt &&
      needs.final-guard.outputs.workflow_sha == github.sha &&
      needs.review.result == 'success' &&
      needs.review.outputs.ready == 'true' &&
      ((needs.final-guard.outputs.decision == 'allow' && needs.sign.result == 'success') ||
       (needs.final-guard.outputs.decision == 'already-validated' &&
        needs.recover-validated.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: read
      issues: read
    environment:
      name: github-pages
