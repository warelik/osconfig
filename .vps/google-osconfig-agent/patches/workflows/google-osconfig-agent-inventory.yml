    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      exists: ${{ needs.candidate-source.outputs.exists == 'true' || needs.policy-check.outputs.changed == 'true' }}
      policy_validated: ${{ steps.policy.outputs.policy_validated || steps.policy-reuse.outputs.policy_validated || steps.policy-proposal.outputs.policy_validated || steps.policy-proposal-reuse.outputs.policy_validated || steps.policy-proposal-history-reuse.outputs.policy_validated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open(".vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> .git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.policy-check.outputs.changed == 'true'
        with:
          ref: ${{ needs.policy-check.outputs.head }}
          path: policy-candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.candidate-source.outputs.exists == 'true'
        with:
          name: google-osconfig-agent-candidate
          path: ${{ runner.temp }}/osconfig-candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.policy-check.outputs.changed == 'true'
        with:
          name: google-osconfig-agent-policy-candidate
          path: ${{ runner.temp }}/osconfig-policy-candidate
      - name: Verify the normal candidate and current native run attempt
        if: needs.candidate-source.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ needs.candidate-source.outputs.pr }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py verify-final-run \
            "$RUNNER_TEMP/osconfig-candidate" \
            "${{ needs.final-guard.outputs.run_id }}" \
            "${{ needs.final-guard.outputs.run_attempt }}" \
            "${{ needs.final-guard.outputs.workflow_sha }}" \
            "${{ needs.final-guard.outputs.candidate_id }}"
      - name: Verify the policy proposal and current native run attempt
        if: needs.policy-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ needs.policy-check.outputs.candidate_pr }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py verify-final-run \
            "$RUNNER_TEMP/osconfig-policy-candidate" \
            "${{ needs.policy-final-guard.outputs.run_id }}" \
            "${{ needs.policy-final-guard.outputs.run_attempt }}" \
            "${{ needs.policy-final-guard.outputs.workflow_sha }}" \
            "${{ needs.policy-final-guard.outputs.candidate_id }}"
      - name: Install declared workflow parser dependency
        if: >-
          (needs.candidate-source.outputs.exists == 'true' &&
           needs.final-guard.outputs.validated_bundle != 'true' &&
           needs.final-guard.outputs.policy_validation_reuse != 'true') ||
          (needs.policy-check.outputs.changed == 'true' &&
           needs.policy-final-guard.outputs.validated_bundle != 'true' &&
           needs.policy-final-guard.outputs.policy_validation_reuse != 'true')
        run: |
          python3 -m pip install --isolated --disable-pip-version-check --no-input --no-cache-dir \
            --only-binary=:all: --no-deps --require-hashes --index-url https://pypi.org/simple \
            --target "$RUNNER_TEMP/osconfig-policy-deps" \
            -r .vps/google-osconfig-agent/patches/requirements-policy.txt
      - name: Test trusted release gate after both reviews
        id: policy
        if: >-
          needs.candidate-source.outputs.exists == 'true' &&
          needs.final-guard.outputs.validated_bundle != 'true' &&
          needs.final-guard.outputs.policy_validation_reuse != 'true'
        env:
          PYTHONPATH: ${{ runner.temp }}/osconfig-policy-deps
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py policy-tests \
            "$GITHUB_WORKSPACE/.vps/google-osconfig-agent/patches/tests"
          echo 'policy_validated=true' >> "$GITHUB_OUTPUT"
      - name: Reuse exact private bundle policy validation
        id: policy-reuse
        if: >-
          needs.candidate-source.outputs.exists == 'true' &&
          (needs.final-guard.outputs.validated_bundle == 'true' ||
           needs.final-guard.outputs.policy_validation_reuse == 'true')
        run: echo 'policy_validated=true' >> "$GITHUB_OUTPUT"
      - name: Read the reviewed proposal's exact private lifecycle pin
        id: proposal-maintenance-pin
        if: >-
          needs.policy-check.outputs.changed == 'true' &&
          needs.policy-final-guard.outputs.validated_bundle != 'true' &&
          needs.policy-final-guard.outputs.policy_validation_reuse != 'true'
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate proposal private lock key")
                  result[key] = value
              return result

          proposal_root = pathlib.Path("policy-candidate")
          relative_lock = pathlib.Path(".vps/google-osconfig-agent/patches/maintenance.lock.json")
          if proposal_root.is_symlink() or not proposal_root.is_dir():
              raise SystemExit("reviewed proposal checkout is missing or unsafe")
          path = proposal_root
          for part in relative_lock.parts:
              path = path / part
              if path.is_symlink():
                  raise SystemExit("reviewed proposal private lock path contains a symlink")
          if (not path.is_file() or path.stat().st_size > 4096
                  or not path.resolve(strict=True).is_relative_to(proposal_root.resolve())):
              raise SystemExit("reviewed proposal has no bounded regular private lock")
          lock = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique_object)
          if (not isinstance(lock, dict)
                  or set(lock) != {"schema", "repository", "revision", "module_sha256", "api_version"}
                  or type(lock.get("schema")) is not int or lock["schema"] != 1
                  or lock.get("repository") != "warelik/machine-maintenance"
                  or not isinstance(lock.get("revision"), str)
                  or not re.fullmatch(r"[0-9a-f]{40}", lock["revision"])
                  or not isinstance(lock.get("module_sha256"), str)
                  or not re.fullmatch(r"[0-9a-f]{64}", lock["module_sha256"])
                  or type(lock.get("api_version")) is not int or lock["api_version"] != 1):
              raise SystemExit("reviewed proposal private lock has an invalid exact identity")
          print(f"revision={lock['revision']}")
          print(f"module_sha256={lock['module_sha256']}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: >-
          needs.policy-check.outputs.changed == 'true' &&
          needs.policy-final-guard.outputs.validated_bundle != 'true' &&
          needs.policy-final-guard.outputs.policy_validation_reuse != 'true'
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.proposal-maintenance-pin.outputs.revision }}
          path: machine-maintenance-proposal
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the reviewed proposal lifecycle source
        if: >-
          needs.policy-check.outputs.changed == 'true' &&
          needs.policy-final-guard.outputs.validated_bundle != 'true' &&
          needs.policy-final-guard.outputs.policy_validation_reuse != 'true'
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance-proposal
          PROPOSAL_MAINTENANCE_REVISION: ${{ steps.proposal-maintenance-pin.outputs.revision }}
          PROPOSAL_MAINTENANCE_MODULE_SHA256: ${{ steps.proposal-maintenance-pin.outputs.module_sha256 }}
        run: |
          set -euo pipefail
          printf '/machine-maintenance-proposal/\n' >> .git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "$PROPOSAL_MAINTENANCE_REVISION"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Proposal private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT" "$PROPOSAL_MAINTENANCE_REVISION" \
            "$PROPOSAL_MAINTENANCE_MODULE_SHA256" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          revision, expected_sha256 = sys.argv[2:]
          module = root / "fork_lifecycle.py"
          receipt = root / ".maintenance-source.json"
          if (not root.is_absolute() or root.is_symlink() or not root.is_dir()
                  or module.is_symlink() or not module.is_file() or module.stat().st_size > 262144
                  or receipt.is_symlink() or receipt.exists()):
              raise SystemExit("proposal private source checkout is unsafe or already receipted")
          if (not re.fullmatch(r"[0-9a-f]{40}", revision)
                  or not re.fullmatch(r"[0-9a-f]{64}", expected_sha256)):
              raise SystemExit("proposal private source outputs are malformed")
          source = module.read_bytes()
          if hashlib.sha256(source).hexdigest() != expected_sha256:
              raise SystemExit("proposal private source differs from its reviewed lock checksum")
          receipt.write_text(json.dumps({
              "repository": "warelik/machine-maintenance", "revision": revision,
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
      - name: Sandbox and test the proposed publisher policy after both reviews
        id: policy-proposal
        if: >-
          needs.policy-check.outputs.changed == 'true' &&
          needs.policy-final-guard.outputs.validated_bundle != 'true' &&
          needs.policy-final-guard.outputs.policy_validation_reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_PR_NUMBER: ${{ needs.policy-check.outputs.pr }}
          POLICY_HEAD_SHA: ${{ needs.policy-check.outputs.head }}
          PYTHONPATH: ${{ runner.temp }}/osconfig-policy-deps
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance-proposal
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py policy-validate-shared policy-candidate
          echo 'policy_validated=true' >> "$GITHUB_OUTPUT"
      - name: Reuse exact verified private policy bundle for the proposal
        id: policy-proposal-reuse
        if: >-
          needs.policy-check.outputs.changed == 'true' &&
          needs.policy-final-guard.outputs.validated_bundle == 'true'
        run: echo 'policy_validated=true' >> "$GITHUB_OUTPUT"
      - name: Reuse exact prior policy validation for the proposal
        id: policy-proposal-history-reuse
        if: >-
          needs.policy-check.outputs.changed == 'true' &&
          needs.policy-final-guard.outputs.validated_bundle != 'true' &&
          needs.policy-final-guard.outputs.policy_validation_reuse == 'true'
        run: echo 'policy_validated=true' >> "$GITHUB_OUTPUT"

  adopt-policy:
    needs: [policy-check, policy-review, policy-final-guard, prepare]
    if: >-
      always() && !cancelled() &&
      needs.policy-check.outputs.changed == 'true' &&
      needs.policy-review.result == 'success' && needs.policy-review.outputs.ready == 'true' &&
      needs.policy-final-guard.result == 'success' &&
      needs.policy-final-guard.outputs.decision == 'policy-only' &&
      needs.policy-final-guard.outputs.candidate_id == needs.policy-check.outputs.candidate_id &&
      needs.policy-final-guard.outputs.run_id == github.run_id &&
      needs.policy-final-guard.outputs.run_attempt == github.run_attempt &&
      needs.policy-final-guard.outputs.workflow_sha == github.sha &&
      needs.prepare.result == 'success' && needs.prepare.outputs.policy_validated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy-check.outputs.head }}
          path: proposal
          persist-credentials: false
          fetch-depth: 0
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open("trusted/.vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> trusted/.git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-osconfig-agent-policy-candidate
          path: ${{ runner.temp }}/osconfig-policy-candidate
      - name: Adopt only exact reviewed policy blobs without starting a second cycle
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          POLICY_PR_NUMBER: ${{ needs.policy-check.outputs.pr }}
          POLICY_HEAD_SHA: ${{ needs.policy-check.outputs.head }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: python3 -B trusted/.vps/google-osconfig-agent/patches/release.py adopt-policy-pair \
          "$RUNNER_TEMP/osconfig-policy-candidate" "$GITHUB_WORKSPACE/proposal"

  close-policy-only-candidate:
    needs: [candidate-source, review, final-guard, prepare]
    if: >-
      always() && !cancelled() &&
      needs.candidate-source.outputs.exists == 'true' &&
      needs.review.result == 'success' && needs.review.outputs.ready == 'true' &&
      needs.final-guard.result == 'success' && needs.final-guard.outputs.decision == 'policy-only' &&
      needs.final-guard.outputs.candidate_id == needs.candidate-source.outputs.candidate_id &&
      needs.final-guard.outputs.run_id == github.run_id &&
      needs.final-guard.outputs.run_attempt == github.run_attempt &&
      needs.final-guard.outputs.workflow_sha == github.sha &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: trusted
          persist-credentials: false
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open("trusted/.vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> trusted/.git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - name: Close the reviewed temporary contexts after policy-only validation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ needs.candidate-source.outputs.pr }}
          DELTA_PR: ${{ needs.candidate-source.outputs.delta_pr }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: python3 -B trusted/.vps/google-osconfig-agent/patches/release.py close .

  repair:
    needs: [candidate-source, build-rpm, review]
    if: >-
      always() && needs.candidate-source.outputs.exists == 'true' &&
      (needs.build-rpm.outputs.failure_class == 'application' ||
       (needs.review.result == 'success' && needs.review.outputs.ready == 'false' &&
        needs.review.outputs.reason != 'Waiting for Codex; no completed exact-SHA review' &&
        needs.review.outputs.reason != 'Both distinct exact-source review lists must complete before repair'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-osconfig-agent-candidate
          path: ${{ runner.temp }}/osconfig-candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.review.result == 'success'
        with:
          name: google-osconfig-agent-review-pair
          path: ${{ runner.temp }}/osconfig-review
      - name: Request a native Codex fix with the failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          REVIEW_REASON: ${{ needs.review.outputs.reason }}
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py failed-job-evidence \
            "$GITHUB_RUN_ID" "$RUNNER_TEMP/failing-jobs.log"
          { printf 'Review state: %s\n\n' "$REVIEW_REASON"; \
            cat "$RUNNER_TEMP/osconfig-review/review-pair.json" 2>/dev/null || true; \
            cat "$RUNNER_TEMP/failing-jobs.log"; } \
            > "$RUNNER_TEMP/osconfig-failure-evidence.txt"
          python3 -B .vps/google-osconfig-agent/patches/release.py repair \
            "$RUNNER_TEMP/osconfig-candidate" "$RUNNER_TEMP/osconfig-failure-evidence.txt"

  repair-publisher:
    needs: [candidate-source, prepare, build-rpm, review, final-guard, sign, recover-validated,
            publish, adopt, policy-resume]
    if: >-
      always() &&
      (needs.candidate-source.result == 'failure' || needs.prepare.result == 'failure' ||
       needs.build-rpm.outputs.failure_class == 'publisher' ||
       (needs.build-rpm.result == 'failure' && needs.build-rpm.outputs.failure_class != 'application') ||
       needs.review.result == 'failure' ||
       needs.final-guard.result == 'failure' ||
       needs.sign.result == 'failure' || needs.recover-validated.result == 'failure' ||
       needs.publish.result == 'failure' ||
       needs.adopt.result == 'failure' || needs.policy-resume.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Request a separate machine repair for publisher and workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          POLICY_CONFIG_SHA: ${{ github.sha }}
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py failed-job-evidence \
            "$GITHUB_RUN_ID" "$RUNNER_TEMP/publisher-failure.log"
          python3 -B .vps/google-osconfig-agent/patches/release.py repair-policy \
            "$RUNNER_TEMP/publisher-failure.log"

  sign:
    needs: [candidate-source, review, final-guard, prepare, build-rpm]
    if: >-
      always() && !cancelled() &&
      needs.prepare.outputs.exists == 'true' && needs.build-rpm.result == 'success' &&
      needs.review.result == 'success' && needs.review.outputs.ready == 'true' &&
      needs.candidate-source.outputs.exists == 'true' &&
      needs.final-guard.result == 'success' && needs.final-guard.outputs.decision == 'allow' &&
      needs.final-guard.outputs.candidate_id == needs.candidate-source.outputs.candidate_id &&
      needs.final-guard.outputs.run_id == github.run_id &&
      needs.final-guard.outputs.run_attempt == github.run_attempt &&
      needs.final-guard.outputs.workflow_sha == github.sha &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: fedora:44
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check the frozen native run attempt before checkout or signing tools
        env:
          EXPECTED_RUN_ID: ${{ needs.final-guard.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.final-guard.outputs.run_attempt }}
          EXPECTED_WORKFLOW_SHA: ${{ needs.final-guard.outputs.workflow_sha }}
          EXPECTED_CANDIDATE_ID: ${{ needs.final-guard.outputs.candidate_id }}
          EXPECTED_DECISION: ${{ needs.final-guard.outputs.decision }}
          SOURCE_CANDIDATE_ID: ${{ needs.candidate-source.outputs.candidate_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DECISION" == allow ]]
          [[ "$EXPECTED_RUN_ID" == "$GITHUB_RUN_ID" ]]
          [[ "$EXPECTED_RUN_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$EXPECTED_CANDIDATE_ID" == "$SOURCE_CANDIDATE_ID" ]]
      - name: Check out the exact trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the exact private lifecycle revision
        id: maintenance-pin
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open(".vps/google-osconfig-agent/patches/maintenance.lock.json", encoding="utf-8"))
          revision = lock.get("revision", "")
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          print(f"revision={revision}")
          PY
      - name: Install private checkout transport tools
        run: dnf -y install git openssh-clients
      - name: Check out the exact private lifecycle source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.maintenance-pin.outputs.revision }}
          path: machine-maintenance
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and receipt the exact read-only lifecycle source
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          printf '/machine-maintenance/\n' >> .git/info/exclude
          test "$(git -C "$FORK_MAINTENANCE_ROOT" rev-parse HEAD)" = "${{ steps.maintenance-pin.outputs.revision }}"
          if git -C "$FORK_MAINTENANCE_ROOT" config --local --get-regexp 'http\..*\.extraheader|core\.sshcommand' >/dev/null; then
            echo 'Private lifecycle checkout retained Git authentication' >&2
            exit 1
          fi
          python3 -B - "$FORK_MAINTENANCE_ROOT/.maintenance-source.json" \
            "${{ steps.maintenance-pin.outputs.revision }}" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"repository": "warelik/machine-maintenance", "revision": sys.argv[2]}, stream)
              stream.write("\n")
          PY
      - name: Install RPM signing tools
        run: dnf -y install rpm-sign createrepo_c gnupg2 rpm jq coreutils findutils
      - name: Download the exact built RPM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-osconfig-agent-built-rpm
          path: ${{ runner.temp }}/osconfig-built
      - name: Download the exact candidate source artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-osconfig-agent-candidate
          path: ${{ runner.temp }}/osconfig-candidate
      - name: Verify this exact native run and built RPM receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ needs.candidate-source.outputs.pr }}
          EXPECTED_CANDIDATE_ID: ${{ needs.final-guard.outputs.candidate_id }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py verify-final-run \
            "$RUNNER_TEMP/osconfig-candidate" \
            "${{ needs.final-guard.outputs.run_id }}" \
            "${{ needs.final-guard.outputs.run_attempt }}" \
            "${{ needs.final-guard.outputs.workflow_sha }}" \
            "${{ needs.final-guard.outputs.candidate_id }}"
          python3 -B .vps/google-osconfig-agent/patches/release.py verify-build-provenance \
            "$RUNNER_TEMP/osconfig-candidate" "$RUNNER_TEMP/osconfig-built" \
            "${{ needs.final-guard.outputs.run_id }}" \
            "${{ needs.final-guard.outputs.run_attempt }}" \
            "${{ needs.final-guard.outputs.workflow_sha }}" \
            "${{ needs.final-guard.outputs.candidate_id }}"
      - name: Check signing and verifier rejection with disposable keys
        run: bash .vps/google-osconfig-agent/patches/tests/signing.sh "$RUNNER_TEMP/osconfig-built"
      - name: Sign and verify RPM and RPM-MD metadata
        env:
          OSCONFIG_RPM_SIGNING_PRIVATE_KEY: ${{ secrets.OSCONFIG_RPM_SIGNING_PRIVATE_KEY }}
          OSCONFIG_RPM_SIGNING_FINGERPRINT: ${{ vars.OSCONFIG_RPM_SIGNING_FINGERPRINT }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.candidate-source.outputs.sha }}
          EXPECTED_UPSTREAM_SHA: ${{ needs.candidate-source.outputs.upstream }}
          EXPECTED_PATCH_SHA: ${{ needs.candidate-source.outputs.patch }}
        run: |
          bash .vps/google-osconfig-agent/patches/sign-repo.sh \
            "$RUNNER_TEMP/osconfig-built" "$RUNNER_TEMP/osconfig-pages"
          bash .vps/google-osconfig-agent/patches/verify-repo.sh \
            "$RUNNER_TEMP/osconfig-built" "$RUNNER_TEMP/osconfig-pages"
      - name: Upload the signed RPM repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-osconfig-agent-pages
          path: ${{ runner.temp }}/osconfig-pages/rpm
          if-no-files-found: error
          retention-days: 3
      - name: Record the exact native signature artifact identity
        env:
          EXPECTED_CANDIDATE_ID: ${{ needs.final-guard.outputs.candidate_id }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/machine-maintenance
        run: |
          python3 -B .vps/google-osconfig-agent/patches/release.py \
            write-signature-proof "$RUNNER_TEMP/osconfig-candidate" \
            "$RUNNER_TEMP/osconfig-built" "$RUNNER_TEMP/osconfig-pages/rpm" \
            "$RUNNER_TEMP/osconfig-final-proof"
      - name: Upload exact native signature provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-osconfig-agent-final-proof
          path: ${{ runner.temp }}/osconfig-final-proof
          if-no-files-found: error
          retention-days: 3

  recover-validated:
    needs: [candidate-source, review, final-guard, prepare]
    if: >-
      always() && !cancelled() &&
      needs.candidate-source.outputs.exists == 'true' &&
      needs.review.result == 'success' && needs.review.outputs.ready == 'true' &&
      needs.final-guard.result == 'success' &&
      needs.final-guard.outputs.decision == 'already-validated' &&
      needs.final-guard.outputs.candidate_id == needs.candidate-source.outputs.candidate_id &&
      needs.final-guard.outputs.run_id == github.run_id &&
      needs.final-guard.outputs.run_attempt == github.run_attempt &&
      needs.final-guard.outputs.workflow_sha == github.sha &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: fedora:44
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check the frozen metadata-continuation attempt
        env:
          EXPECTED_RUN_ID: ${{ needs.final-guard.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.final-guard.outputs.run_attempt }}
          EXPECTED_WORKFLOW_SHA: ${{ needs.final-guard.outputs.workflow_sha }}
          EXPECTED_CANDIDATE_ID: ${{ needs.final-guard.outputs.candidate_id }}
          SOURCE_CANDIDATE_ID: ${{ needs.candidate-source.outputs.candidate_id }}
          REUSE_RUN_ID: ${{ needs.final-guard.outputs.reuse_run_id }}
          REUSE_RUN_ATTEMPT: ${{ needs.final-guard.outputs.reuse_run_attempt }}
          REUSE_WORKFLOW_SHA: ${{ needs.final-guard.outputs.reuse_workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUN_ID" == "$GITHUB_RUN_ID" ]]
          [[ "$EXPECTED_RUN_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$EXPECTED_CANDIDATE_ID" == "$SOURCE_CANDIDATE_ID" ]]
          [[ "$REUSE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REUSE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$REUSE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
